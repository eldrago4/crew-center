<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signal Lost · Indian Virtual</title>
<meta name="robots" content="noindex" />
<!--
  Static fallback for Cloudflare Worker "exceeded resources" (Error 1102), shown
  when the worker is killed mid-render under load. It is NOT auto-served on the
  free plan (Cloudflare serves its own 1102 page and there is no asset-fallback
  hook). To actually surface this: (a) Cloudflare Pro -> Custom Error Pages (upload
  this file; some categories require the ::CLOUDFLARE_ERROR_500S_BOX:: token), or
  (b) a thin guard worker that serves /1102.html when the main worker fails.
  Must stay 100% static & self-contained: no build step, no framework, no external
  fonts/images/JS — it has to render even when everything else is down.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  :root { color-scheme: dark; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px 22vh;
    background: #0b1020;
    color: #e6ebf5;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  .glyph {
    width: 56px; height: 56px; margin-bottom: 28px;
    color: #f43f5e; opacity: 0.9;
  }
  .title {
    font-weight: 700; letter-spacing: -0.02em;
    font-size: clamp(28px, 6vw, 44px); line-height: 1.15;
    margin: 0 0 14px; color: #ffffff;
  }
  .body {
    font-size: clamp(15px, 3.6vw, 18px); line-height: 1.55;
    color: #9aa4b8; margin: 0 auto; max-width: 30rem;
  }
  .cta { margin-top: 34px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .btn {
    font: inherit; font-weight: 600; font-size: 16px;
    padding: 12px 34px; border-radius: 10px; cursor: pointer;
    border: none; text-decoration: none; display: inline-block;
    transition: background-color .18s ease, transform .05s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: #e11d48; color: #ffffff; }
  .btn-primary:hover { background: #be123c; }
  .home { font-size: 13px; color: #6b7280; text-decoration: none; margin-top: 18px; }
  .home:hover { color: #9aa4b8; }
  .code {
    margin-top: 56px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px; letter-spacing: 0.06em; color: #6b7280;
    background: rgba(255,255,255,0.05); padding: 4px 12px; border-radius: 999px;
  }
  @media (min-width: 640px) { .cta { flex-direction: row; gap: 20px; } }
</style>
</head>
<body>
  <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
    <line x1="12" y1="9" x2="12" y2="13" />
    <line x1="12" y1="17" x2="12.01" y2="17" />
  </svg>

  <h1 class="title">Signal Lost.</h1>
  <p class="body">
    Our flight systems are handling heavy traffic right now and couldn&rsquo;t
    load this page. Give it a moment, then try again.
  </p>

  <div class="cta">
    <button class="btn btn-primary" onclick="location.reload()">Reload the page</button>
  </div>

  <a class="home" href="/crew">Back to the crew center</a>

  <span class="code">Error 1102</span>
</body>
</html>
