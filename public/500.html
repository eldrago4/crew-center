<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signal Lost · Indian Virtual</title>
<meta name="robots" content="noindex" />
<!--
  Vercel PLATFORM error page — not a Next.js route. Vercel's edge serves this
  static file directly (build output scan → public/500.html) for any 5xx that
  happens BEFORE our app runs: function timeouts (504), throttling, and a paused
  deployment (503 DEPLOYMENT_PAUSED — what happens if this project ever exceeds
  its Hobby usage/compute budget). None of that is exposed here or to the visitor;
  the copy stays identical to the in-app error.jsx page on purpose, so a platform
  outage looks the same as an app-level one. Must stay 100% static: no build step,
  no server call, no framework — see https://vercel.com/docs/custom-error-pages.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
/>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  .err-root {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /* 20% above center, matching src/app/error.jsx */
    padding: 24px 20px 40vh;
    background: #f8f9ff;
    color: #0d1c2e;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    text-align: center;
  }
  .err-graphic { width: clamp(320px, 78vw, 760px); height: auto; margin-bottom: 32px; user-select: none; }
  .err-text { max-width: 512px; }
  .err-title {
    font-family: 'Hanken Grotesk', system-ui, sans-serif;
    font-weight: 700; letter-spacing: -0.02em; color: #000000;
    font-size: 32px; line-height: 40px;
    margin: 0 0 16px;
  }
  .err-body {
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 400; font-size: 18px; line-height: 28px; color: #45464d;
    margin: 0;
  }
  .err-cta {
    margin-top: 40px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  }
  .err-btn {
    font-family: 'Hanken Grotesk', system-ui, sans-serif;
    font-weight: 600; font-size: 16px; line-height: 24px;
    padding: 12px 32px; border-radius: 8px; cursor: pointer;
    transition: background-color .2s ease, border-color .2s ease, color .2s ease;
    width: 100%;
    text-decoration: none; display: inline-block; border: none;
  }
  .err-btn-primary { background: #000000; color: #ffffff; }
  .err-btn-primary:hover { background: #006591; }
  .err-btn-secondary { background: transparent; color: #000000; border: 1px solid #000000; }
  .err-btn-secondary:hover { background: #eff4ff; border-color: #006591; color: #006591; }
  .err-code {
    margin-top: 64px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-weight: 500; font-size: 13px; line-height: 16px; letter-spacing: 0.05em;
    color: #76777d; background: #d5e3fc;
    padding: 4px 12px; border-radius: 999px;
    display: inline-block;
  }
  .err-reqid {
    margin-top: 12px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px; color: #9a9aa5;
  }
  @media (min-width: 640px) {
    .err-cta { flex-direction: row; gap: 24px; }
    .err-btn { width: auto; }
  }
  @media (min-width: 768px) {
    .err-root { padding-left: 64px; padding-right: 64px; }
    .err-title { font-size: 48px; line-height: 56px; }
  }
</style>
</head>
<body>
  <main class="err-root">
    <img class="err-graphic" src="/error/500.webp" alt="" aria-hidden="true" />

    <div class="err-text">
      <h1 class="err-title">Signal Lost.</h1>
      <p class="err-body">
        We&rsquo;ve lost connection with our flight systems. Our technicians are
        recalibrating the instruments.
      </p>
    </div>

    <div class="err-cta">
      <a class="err-btn err-btn-primary" href="javascript:location.reload()">Retry Flight</a>
      <a
        class="err-btn err-btn-secondary"
        href="https://discord.com/users/433143285847031838"
        target="_blank"
        rel="noopener noreferrer"
      >
        Contact Dispatch
      </a>
    </div>

    <a href="/" style="margin-top: 20px; font-family: 'Inter', sans-serif; font-size: 13px; color: #76777d; text-decoration: none; display: block;">
      Back to Home Base
    </a>

    <span class="err-code">Error Code: 500</span>
    <!-- Opaque request ID only — never the real Vercel error code/reason, so an
         outage never reads to a visitor as "quota/budget exceeded". Useful for
         support to correlate against Vercel's logs if reported via Discord. -->
    <div class="err-reqid">Ref: ::vercel:REQUEST_ID::</div>
  </main>
</body>
</html>
